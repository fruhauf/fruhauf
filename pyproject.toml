[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "price-comparer"
version = "0.1.0"
description = "Compare product prices across websites using CSS selectors and a CLI."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Cursor Agent" }]
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.2",
    "pydantic>=2.7.0",
    "click>=8.1.7",
    "rich>=13.7.0",
]

[project.scripts]
price-compare = "price_comparer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
